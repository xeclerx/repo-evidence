services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repo_evidence
      POSTGRES_USER: repo_evidence
      POSTGRES_PASSWORD: repo_evidence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_evidence"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://repo_evidence:repo_evidence@postgres:5432/repo_evidence
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OTEL_ENABLED: "false"
      ANALYSIS_TEMP_ROOT: /tmp/repo-evidence
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["celery", "-A", "repo_evidence.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
