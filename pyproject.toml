[project]
name = "repo-evidence"
version = "0.1.0"
description = "Прозрачный анализ инженерной зрелости Python backend-репозиториев"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "xeclerx" }]
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-sdk>=1.29,<2",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/xeclerx/repo-evidence"
Repository = "https://github.com/xeclerx/repo-evidence.git"
Issues = "https://github.com/xeclerx/repo-evidence/issues"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.122,<7",
  "mypy>=1.14,<3",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6.0,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "testcontainers[postgres,redis]>=4.9,<5",
]

[project.scripts]
repo-evidence = "repo_evidence.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_evidence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL through TEST_DATABASE_URL"]

[tool.coverage.run]
branch = true
source = ["repo_evidence"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["repo_evidence"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
